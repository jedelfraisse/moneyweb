name: Build & Deploy to Mochahost

on:
  push:
    branches: [ release ]
  workflow_dispatch:  # allow manual runs from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore MoneyWeb.Blazor/MoneyWeb.Blazor.csproj

      - name: Write production appsettings
        run: |
          cat > MoneyWeb.Blazor/appsettings.Production.json << 'EOF'
          ${{ secrets.APPSETTINGS_PRODUCTION }}
          EOF

      - name: Publish
        run: |
          dotnet publish MoneyWeb.Blazor/MoneyWeb.Blazor.csproj \
            -c Release \
            -o ./publish \
            --no-restore

      - name: Put site offline
        run: |
          echo "<html><body><h1>Site is updating, please check back shortly.</h1></body></html>" > /tmp/app_offline.htm
          curl -T /tmp/app_offline.htm ftp://${{ secrets.FTP_SERVER }}/app_offline.htm \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            --ftp-create-dirs --silent
          sleep 5

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/appsettings.Development.json
            **/app_offline.htm
            **/_app_offline.htm

      - name: Bring site back online
        if: always()
        run: |
          curl ftp://${{ secrets.FTP_SERVER }}/ \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            -Q "DELE app_offline.htm" --silent || true
