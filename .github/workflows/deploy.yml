name: Build & Deploy to Mochahost

on:
  push:
    branches: [ release ]
  workflow_dispatch:  # allow manual runs from GitHub UI

# The job only reads the repo; deployment uses FTP secrets, not the GitHub token.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore MoneyWeb.Blazor/MoneyWeb.Blazor.csproj

      - name: Write production appsettings
        run: printf '%s' "$APPSETTINGS_PRODUCTION" > MoneyWeb.Blazor/appsettings.Production.json
        env:
          APPSETTINGS_PRODUCTION: ${{ secrets.APPSETTINGS_PRODUCTION }}

      - name: Publish
        run: |
          dotnet publish MoneyWeb.Blazor/MoneyWeb.Blazor.csproj \
            -c Release \
            -o ./publish \
            --no-restore

      - name: Put site offline
        run: |
          python3 - << 'PYEOF'
          import ftplib, io, os
          with open('./publish/_app_offline.htm', 'rb') as f:
              content = f.read()
          server = os.environ['FTP_SERVER'].strip()
          if '://' in server:
              server = server.split('://', 1)[1]
          server = server.rstrip('/')
          # Explicit FTPS: credentials and files must never cross the wire in plain text.
          ftp = ftplib.FTP_TLS(timeout=60)
          ftp.connect(server)
          ftp.login(os.environ['FTP_USERNAME'], os.environ['FTP_PASSWORD'])
          ftp.prot_p()
          # Not storbinary(): the host resets the data connection during the TLS close handshake
          # (unwrap), failing the step even though the file arrived. Send, close, then check the reply.
          conn = ftp.transfercmd('STOR app_offline.htm')
          conn.sendall(content)
          conn.close()
          ftp.voidresp()
          try:
              ftp.quit()
          except (OSError, EOFError):
              ftp.close()
          print('app_offline.htm uploaded')
          PYEOF
          sleep 5
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps   # encrypted — the upload includes appsettings.Production.json
          local-dir: ./publish/
          server-dir: /
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/appsettings.Development.json
            **/app_offline.htm
            **/_app_offline.htm

      - name: Bring site back online
        if: always()
        run: |
          python3 - << 'PYEOF'
          import ftplib, os
          server = os.environ['FTP_SERVER'].strip()
          if '://' in server:
              server = server.split('://', 1)[1]
          server = server.rstrip('/')
          # Explicit FTPS: credentials and files must never cross the wire in plain text.
          ftp = ftplib.FTP_TLS(timeout=60)
          ftp.connect(server)
          ftp.login(os.environ['FTP_USERNAME'], os.environ['FTP_PASSWORD'])
          ftp.prot_p()
          try:
              ftp.delete('app_offline.htm')
              print('app_offline.htm deleted')
          except ftplib.error_perm:
              print('app_offline.htm not found, site already online')
          try:
              ftp.quit()
          except (OSError, EOFError):
              ftp.close()
          PYEOF
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
